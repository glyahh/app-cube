spring:
  application:
    name: glyahh-ai-generate-code-backend

  # 仓库根的 .env 同时被 Python 侧读取（agent/env_utils.py）。
  # 两边读同一份，避免密钥与配置在两侧漂移。
  # optional: 前缀保证文件不存在时不阻断启动（新克隆的仓库还没建 .env）。
  # [.properties] 是给 Spring 的解析器提示 —— .env 不是它认识的标准扩展名。
  config:
    import: optional:file:./.env[.properties]

  # PostgreSQL。列名已统一 snake_case（PG 会把未加引号的标识符折叠成小写）。
  # 回滚到 MySQL：把 driver/url 换回去、flyway.enabled 关掉即可，数据两边都在。
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/gly_ai_generate_code?currentSchema=biz
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:gly@0124}

  # 迁移脚本见 src/main/resources/db/migration/
  # 已切到 PostgreSQL，脚本与 datasource 方言一致，可以打开了。
  # V1 建 8 张业务表，V2 建 agent_run 台账。
  flyway:
    enabled: true
    # 建表账号与业务读写账号分开，避免给业务账号增加 DDL 权限。
    user: ${FLYWAY_USER:${POSTGRES_USER:postgres}}
    password: ${FLYWAY_PASSWORD:${POSTGRES_PASSWORD:}}
    schemas: biz
    default-schema: biz
    create-schemas: true
    locations: classpath:db/migration
    # 新库首次启动自动建表；已有库由 Flyway 记录版本，不重复执行。
    baseline-on-migrate: true
    baseline-version: 2

  #Redis
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password:
      ttl: 3600

  # 本地配置切换开关：local-a / local-b，改下一行 profile 名即可
  profiles:
    active: local-b

  # 用于存储ai和用户的聊天记忆
  session:
    store-type: redis
    timeout: 2592000 # 30天过期

server:
  port: 8124
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 2592000


aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:}
    accessKeyId: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    accessKeySecret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    bucketName: ${ALIYUN_OSS_BUCKET_NAME:}
    region: ${ALIYUN_OSS_REGION:cn-hangzhou}


# springdoc-openapi 配置
springdoc:
  group-configs:
  - group: 'default'
    paths-to-match: '/**'
    packages-to-scan: com.dbts.glyahhaigeneratecode.controller
# knife4j 配置项
knife4j:
  enable: true
  setting:
    language: zh_cn

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      access: unrestricted
