spring:
  application:
    name: glyahh-ai-generate-code-backend

  # 仓库根的 .env 同时被 Python 侧读取（agent/env_utils.py）。
  # 两边读同一份，避免密钥与配置在两侧漂移。
  # optional: 前缀保证文件不存在时不阻断启动（新克隆的仓库还没建 .env）。
  # [.properties] 是给 Spring 的解析器提示 —— .env 不是它认识的标准扩展名。
  config:
    import: optional:file:./.env[.properties]

  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/gly_ai_generate_code
    username: ${spring.datasource.username}
    password: ${spring.datasource.password}

  # 迁移脚本见 src/main/resources/db/migration/
  #
  # **默认关闭**：脚本是 PostgreSQL 方言，而当前 datasource 是 MySQL ——
  # 一旦默认启用，启动时就会拿 PG 脚本去 MySQL 上跑。
  #
  # 切到 PostgreSQL 时（见 docs/PLANS/agent-next-migration.md）：
  #   1. 换 driver-class-name / url（url 加 ?currentSchema=biz）
  #   2. 把 enabled 改成 true
  #   3. 确认 schemas / default-schema 都是 biz
  flyway:
    enabled: false
    schemas: biz
    default-schema: biz
    create-schemas: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  #Redis
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password:
      ttl: 3600

  # 本地配置切换开关：local-a / local-b，改下一行 profile 名即可
  profiles:
    active: local-b

  # 用于存储ai和用户的聊天记忆
  session:
    store-type: redis
    timeout: 2592000 # 30天过期

server:
  port: 8124
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 2592000


aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:}
    accessKeyId: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    accessKeySecret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    bucketName: ${ALIYUN_OSS_BUCKET_NAME:}
    region: ${ALIYUN_OSS_REGION:cn-hangzhou}


# springdoc-openapi 配置
springdoc:
  group-configs:
  - group: 'default'
    paths-to-match: '/**'
    packages-to-scan: com.dbts.glyahhaigeneratecode.controller
# knife4j 配置项
knife4j:
  enable: true
  setting:
    language: zh_cn

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      access: unrestricted
