name: PR Checks

on:
  pull_request:
  push:
    branches: [master, code_board]
  schedule:
    # 每周一 02:23（北京时间）完整跑一次，防止路径过滤和缓存掩盖问题。
    - cron: "23 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  AGENT_ENV_FILE: /dev/null
  AGENT_MODEL_API_KEY: ""
  DEEPSEEK_API_KEY: ""
  DASHSCOPE_API_KEY: ""
  AGENT_SUMMARIZER_API_KEY: ""
  AGENT_MODEL_BASE_URL: "http://127.0.0.1:9/v1"
  AGENT_SUMMARIZER_BASE_URL: "http://127.0.0.1:9/v1"
  AGENT_MODEL_PROXY_ENABLED: "false"

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend || 'true' }}
      agent: ${{ steps.filter.outputs.agent || 'true' }}
      frontend: ${{ steps.filter.outputs.frontend || 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        with:
          filters: |
            backend:
              - 'pom.xml'
              - 'mvnw'
              - 'mvnw.cmd'
              - '.mvn/**'
              - 'src/**'
              - 'scripts/ci/**'
              - '.github/**'
            agent:
              - 'agent/**'
              - 'scripts/ci/**'
              - '.github/**'
            frontend:
              - 'ai-generate-code-frontend/**'
              - 'scripts/ci/**'
              - '.github/**'

  backend:
    name: backend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - name: Install Python test runtime
        run: uv sync --directory agent --frozen
      - name: Compile production code
        run: ./mvnw -B --no-transfer-progress -DskipTests compile
      - name: Unit and security regression tests
        run: ./mvnw -B --no-transfer-progress test
      - name: Reject empty, failed or skipped test evidence
        if: always()
        run: python3 scripts/ci/check_test_results.py 'target/surefire-reports/*.xml'
      - name: Build backend artifact
        run: ./mvnw -B --no-transfer-progress -DskipTests package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-test-reports
          path: target/surefire-reports
          if-no-files-found: warn
          retention-days: 7

  agent:
    name: agent
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - name: Install locked Python dependencies
        run: uv sync --directory agent --frozen
      - name: Run tests without external network
        run: |
          mkdir -p agent/target
          sudo unshare --net -- bash -c '
            ip link set lo up
            exec agent/.venv/bin/python -I -m pytest agent/tests -q -m "not external" \
              --junitxml=agent/target/pytest-results.xml
          '
      - name: Reject empty, failed or skipped test evidence
        if: always()
        run: python3 scripts/ci/check_test_results.py agent/target/pytest-results.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: agent-test-reports
          path: agent/target/pytest-results.xml
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ai-generate-code-frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ai-generate-code-frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript type check
        run: npm run type-check
      - name: Static checks
        run: npm run lint:check
      - name: Formatting check
        run: npm run format:check
      - name: Unit tests
        run: npm run test:unit -- --reporter=default --reporter=junit --outputFile.junit=test-results/vitest.xml
      - name: Initial-load budget contract
        run: npm run test:initial-load-budget
      - name: Reject empty, failed or skipped test evidence
        if: always()
        run: python3 ../scripts/ci/check_test_results.py test-results/vitest.xml
      - name: Production build
        run: npm run build-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frontend-test-reports
          path: ai-generate-code-frontend/test-results
          if-no-files-found: warn
          retention-days: 7

  integration:
    name: integration
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - name: Install Python test runtime
        run: uv sync --directory agent --frozen
      - name: PostgreSQL and Redis integration tests
        run: ./mvnw -B --no-transfer-progress -Dgroups=integration -DexcludedGroups=external test
      - name: Reject empty, failed or skipped test evidence
        if: always()
        run: python3 scripts/ci/check_test_results.py 'target/surefire-reports/*.xml'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: integration-test-reports
          path: target/surefire-reports
          if-no-files-found: warn
          retention-days: 7

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.agent == 'true'
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: app_cube_e2e
          POSTGRES_USER: app_cube
          POSTGRES_PASSWORD: app_cube_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_cube -d app_cube_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      E2E_DB_URL: jdbc:postgresql://127.0.0.1:5432/app_cube_e2e?currentSchema=biz
      E2E_DB_USER: app_cube
      E2E_DB_PASSWORD: app_cube_test_only
      E2E_REDIS_HOST: 127.0.0.1
      E2E_REDIS_PORT: "6379"
    defaults:
      run:
        working-directory: ai-generate-code-frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ai-generate-code-frontend/package-lock.json
      - name: Build backend
        working-directory: .
        run: ./mvnw -B --no-transfer-progress -DskipTests package
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser core workflow
        run: npm run test:e2e
      - name: Reject empty, failed or skipped test evidence
        if: always()
        run: python3 ../scripts/ci/check_test_results.py test-results/e2e.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: e2e-reports
          path: |
            ai-generate-code-frontend/playwright-report
            ai-generate-code-frontend/test-results
          if-no-files-found: warn
          retention-days: 7

  merge-gate:
    name: merge-gate
    if: always()
    needs: [changes, backend, agent, frontend, integration, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          allowed = {"success", "skipped"}
          failed = []
          for name, result in needs.items():
              if result["result"] not in allowed:
                  failed.append(f"{name}={result['result']}")
          outputs = needs["changes"].get("outputs", {})
          required = []
          if outputs.get("backend") == "true": required += ["backend", "integration"]
          if outputs.get("agent") == "true": required.append("agent")
          if outputs.get("frontend") == "true": required.append("frontend")
          if any(outputs.get(k) == "true" for k in ("backend", "agent", "frontend")): required.append("e2e")
          for name in required:
              if needs[name]["result"] != "success":
                  failed.append(f"{name} was required but {needs[name]['result']}")
          if needs["changes"]["result"] != "success":
              failed.append("path detection failed")
          if failed:
              print("\n".join(failed), file=sys.stderr)
              sys.exit(1)
          print("selected checks passed")
          PY
